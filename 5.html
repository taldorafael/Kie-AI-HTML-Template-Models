<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIE.AI — Model Explorer</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --border-hover: #2e2e2e;
    --text: #e8e8e8;
    --muted: #555;
    --accent: #e8ff47;
    --accent2: #47c8ff;
    --accent3: #ff6b6b;
    --accent4: #b47fff;
    --accent5: #47ffb4;
    --font-mono: 'JetBrains Mono', 'Fira Mono', 'Cascadia Code', monospace;
    --font-sans: 'IBM Plex Sans', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 52px;
  }

  .logo {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-decoration: none;
    white-space: nowrap;
  }

  .logo span { color: var(--muted); font-weight: 400; }

  .search-wrap {
    flex: 1;
    max-width: 400px;
    position: relative;
  }

  #search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 10px 6px 30px;
    outline: none;
    transition: border-color .15s;
  }

  #search:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 12px;
    pointer-events: none;
  }

  .header-stats {
    margin-left: auto;
    display: flex;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }

  .header-stats span b { color: var(--text); }

  .api-key-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #apiKey {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 10px;
    outline: none;
    width: 200px;
    transition: border-color .15s;
  }

  #apiKey:focus { border-color: var(--accent); }

  .btn {
    font-family: var(--font-mono);
    font-size: 11px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { opacity: 0.85; color: #000; }

  /* LAYOUT */
  .app { display: flex; height: calc(100vh - 52px); overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    min-width: 220px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
    background: var(--surface);
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }

  .cat-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--muted);
    padding: 14px 16px 5px;
    text-transform: uppercase;
  }

  .cat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 12px;
    padding: 7px 16px;
    cursor: pointer;
    transition: all .12s;
    text-align: left;
  }

  .cat-btn:hover { color: var(--text); }
  .cat-btn.active { color: var(--text); background: var(--border); }
  .cat-btn .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cat-btn .count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    background: var(--border);
    padding: 1px 5px;
    border-radius: 2px;
  }

  /* MAIN */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .section-title {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  .section-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }

  /* MODEL GRID */
  .models-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
    margin-bottom: 32px;
  }

  .model-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all .15s;
    position: relative;
    overflow: hidden;
  }

  .model-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 6px 0 0 6px;
  }

  .model-card[data-cat="image"]::before { background: var(--accent); }
  .model-card[data-cat="video"]::before { background: var(--accent2); }
  .model-card[data-cat="audio"]::before { background: var(--accent5); }
  .model-card[data-cat="chat"]::before { background: var(--accent4); }
  .model-card[data-cat="suno"]::before { background: var(--accent3); }
  .model-card[data-cat="veo"]::before { background: var(--accent2); }
  .model-card[data-cat="upload"]::before { background: var(--muted); }

  .model-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  .model-card.selected {
    border-color: var(--accent);
    background: rgba(232,255,71,0.04);
  }

  .model-name {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    padding-left: 8px;
  }

  .model-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-left: 8px;
    flex-wrap: wrap;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--border);
    color: var(--muted);
    text-transform: uppercase;
  }

  .tag.img { background: rgba(232,255,71,0.1); color: var(--accent); }
  .tag.vid { background: rgba(71,200,255,0.1); color: var(--accent2); }
  .tag.aud { background: rgba(71,255,180,0.1); color: var(--accent5); }
  .tag.chat { background: rgba(180,127,255,0.1); color: var(--accent4); }
  .tag.music { background: rgba(255,107,107,0.1); color: var(--accent3); }

  /* PANEL */
  .panel {
    width: 380px;
    min-width: 380px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }

  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text);
    text-transform: uppercase;
  }

  .panel-model-name {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    padding: 0 20px 12px;
    border-bottom: 1px solid var(--border);
    margin-top: 12px;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border-hover); }

  .field-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
    transition: border-color .15s;
    resize: vertical;
  }

  .field input:focus,
  .field textarea:focus,
  .field select:focus { border-color: var(--accent); }

  .field select option { background: var(--bg); }

  .file-upload-area {
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all .15s;
    background: var(--bg);
  }

  .file-upload-area:hover { border-color: var(--accent2); }

  .file-upload-area input[type="file"] { display: none; }

  .file-upload-text {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }

  .file-upload-text b { color: var(--accent2); }

  .panel-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .result-area {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    min-height: 100px;
    word-break: break-all;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border-hover);
    flex-shrink: 0;
  }

  .status-dot.ok { background: var(--accent5); }
  .status-dot.err { background: var(--accent3); }
  .status-dot.loading { background: var(--accent); animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .result-img {
    max-width: 100%;
    border-radius: 4px;
    border: 1px solid var(--border);
    margin-top: 8px;
    display: none;
  }

  .result-video {
    max-width: 100%;
    border-radius: 4px;
    border: 1px solid var(--border);
    margin-top: 8px;
    display: none;
  }

  .result-audio {
    width: 100%;
    margin-top: 8px;
    display: none;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
    text-align: center;
    padding: 40px;
  }

  .empty-icon {
    font-size: 32px;
    opacity: 0.2;
    margin-bottom: 8px;
  }

  .empty-title {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }

  .empty-sub {
    font-size: 11px;
    color: var(--border-hover);
  }

  /* group separators */
  .group-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .group-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* no-results */
  .no-results {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    padding: 20px 0;
    text-align: center;
  }

  /* upload method tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    border-radius: 3px;
    cursor: pointer;
    transition: all .12s;
  }
  .tab.active { background: var(--border); color: var(--text); }
  .tab:hover { border-color: var(--border-hover); color: var(--text); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .inline-row { display: flex; gap: 8px; }
  .inline-row .field { flex: 1; }

  @media (max-width: 900px) {
    .panel { display: none; }
    .sidebar { width: 180px; min-width: 180px; }
  }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    header { flex-wrap: wrap; height: auto; padding: 10px 14px; gap: 8px; }
    .header-stats { display: none; }
    #apiKey { width: 140px; }
  }
</style>
</head>

<header>

<div class="app">

    <div class="cat-label">Categories</div>

    <button class="cat-btn" data-filter="audio" onclick="filterCat(this,'audio')">
      <span class="dot" style="background:var(--accent5)"></span> Audio
      <span class="count" id="cnt-audio">0</span>
    </button>
    <button class="cat-btn" data-filter="chat" onclick="filterCat(this,'chat')">
      <span class="dot" style="background:var(--accent4)"></span> Chat

      <span class="count" id="cnt-veo">0</span>
    </button>
    <button class="cat-btn" data-filter="upload" onclick="filterCat(this,'upload')">
      <span class="dot" style="background:#555"></span> File Upload
      <span class="count" id="cnt-upload">0</span>
    </button>

    <div class="cat-label" style="margin-top:16px">Quick Links</div>
    <a href="https://kie.ai/market" target="_blank" class="cat-btn" style="text-decoration:none">
      <span class="dot" style="background:#333"></span> Market ↗
    </a>
    <a href="https://kie.ai/pricing" target="_blank" class="cat-btn" style="text-decoration:none">
      <span class="dot" style="background:#333"></span> Pricing ↗
    </a>
    <a href="https://kie.ai/logs" target="_blank" class="cat-btn" style="text-decoration:none">
      <span class="dot" style="background:#333"></span> Logs ↗
    </a>
  </nav>

  <!-- MAIN -->
  <main class="main" id="main">
    <!-- content injected by JS -->
  </main>

  <!-- PANEL -->
  <aside class="panel" id="panel">
    <div class="panel-header">
      <span class="panel-title">API Tester</span>
      <button class="btn" onclick="clearPanel()">Clear</button>
    </div>
    <div id="panelContent" style="flex:1;overflow-y:auto;display:flex;flex-direction:column">
      <div class="empty-state">
        <div class="empty-icon">◈</div>
        <div class="empty-title">Select a model to test</div>
        <div class="empty-sub">Click any model card on the left</div>
      </div>
    </div>
  </aside>
</div>

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentFilter = 'all';
let currentModel = null;
let uploadedFileData = null;

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('kie_api_key');
  if (saved) document.getElementById('apiKey').value = saved;
  updateCounts();
  renderModels();
});

document.getElementById('search').addEventListener('input', renderModels);

function saveKey() {
  const k = document.getElementById('apiKey').value.trim();
  sessionStorage.setItem('kie_api_key', k);
  const btn = document.querySelector('.api-key-area .btn');
  const orig = btn.textContent;
  btn.textContent = 'Saved ✓';
  setTimeout(() => btn.textContent = orig, 1500);
}

function updateCounts() {
  const cats = ['all','image','video','audio','chat','suno','veo','upload'];
  cats.forEach(cat => {
    const cnt = cat === 'all' ? MODELS.length : MODELS.filter(m => m.cat === cat).length;
    document.getElementById('cnt-'+cat).textContent = cnt;
  });
  document.getElementById('totalModels').textContent = MODELS.length;
}

function filterCat(btn, cat) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = cat;
  renderModels();
}

function renderModels() {
  const q = document.getElementById('search').value.toLowerCase();
  const main = document.getElementById('main');

  let list = MODELS.filter(m => {
    const matchCat = currentFilter === 'all' || m.cat === currentFilter;
    const matchQ = !q || m.name.toLowerCase().includes(q) || m.group.toLowerCase().includes(q) || m.model.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  if (!list.length) {
    main.innerHTML = '<div class="no-results">No models found for "' + document.getElementById('search').value + '"</div>';
    return;
  }

  // Group
  const groups = {};
  list.forEach(m => {
    if (!groups[m.group]) groups[m.group] = [];
    groups[m.group].push(m);
  });

  const tagClass = { image:'img', video:'vid', audio:'aud', chat:'chat', suno:'music', veo:'vid', upload:'' };
  const typeLabels = { t2i:'Text→Img', i2i:'Img→Img', t2v:'Text→Vid', i2v:'Img→Vid', v2v:'Vid→Vid', chat:'Chat', tts:'TTS', audio:'Audio', music:'Music', upload:'Upload' };

  let html = '';
  Object.keys(groups).forEach(group => {
    html += `<div class="group-label">${group}</div>`;
    html += '<div class="models-grid">';
    groups[group].forEach(m => {
      const tc = tagClass[m.cat] || '';
      const tl = typeLabels[m.type] || m.type;
      const sel = currentModel && currentModel.id === m.id ? ' selected' : '';
      html += `
        <div class="model-card${sel}" data-cat="${m.cat}" onclick="selectModel('${m.id}')">
          <div class="model-name">${m.name}</div>
          <div class="model-meta">
            <span class="tag ${tc}">${m.cat}</span>
            <span class="tag">${tl}</span>
            <span class="tag" style="margin-left:auto;font-size:8px;color:#333">${m.model}</span>
          </div>
        </div>`;
    });
    html += '</div>';
  });

  main.innerHTML = html;
}

function selectModel(id) {
  currentModel = MODELS.find(m => m.id === id);
  renderModels(); // re-render to update selection highlight
  renderPanel();
}

function clearPanel() {
  currentModel = null;
  renderModels();
  document.getElementById('panelContent').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">◈</div>
      <div class="empty-title">Select a model to test</div>
      <div class="empty-sub">Click any model card on the left</div>
    </div>`;
}

function renderPanel() {
  const m = currentModel;
  if (!m) return;

  const isChat = m.type === 'chat';
  const isUpload = m.cat === 'upload';
  const needsImage = ['i2i','i2v','v2v','audio'].includes(m.type);
  const needsVideo = ['v2v'].includes(m.type);
  const isTTS = m.type === 'tts';
  const isMusic = m.type === 'music';

  let fields = '';

  if (isChat) {
    fields = `
      <div class="field"><div class="field-label">Message</div>
        <textarea id="f_prompt" rows="4" placeholder="Enter your message..."></textarea>
      </div>
      <div class="inline-row">
        <div class="field"><div class="field-label">Max Tokens</div>
          <input type="number" id="f_max_tokens" value="1000">
        </div>
        <div class="field"><div class="field-label">Temperature</div>
          <input type="number" id="f_temperature" value="0.7" step="0.1" min="0" max="2">
        </div>
      </div>`;
  } else if (isUpload) {
    fields = `
      <div class="field"><div class="field-label">File Name (optional)</div>
        <input type="text" id="f_filename" placeholder="my-image.jpg">
      </div>`;
    if (m.id === 'upload-url') {
      fields += `<div class="field"><div class="field-label">File URL</div>
        <input type="url" id="f_fileurl" placeholder="https://example.com/image.jpg">
      </div>`;
    } else {
      fields += `
      <div class="field"><div class="field-label">File</div>
        <div class="file-upload-area" onclick="document.getElementById('f_file').click()">
          <input type="file" id="f_file" onchange="handleFile(event)">
          <div class="file-upload-text" id="fileLabel"><b>Click to browse</b> or drop file</div>
        </div>
      </div>`;
    }
  } else if (isMusic) {
    const sunoFields = {
      'suno-generate': `<div class="field"><div class="field-label">Prompt / Tags</div><input type="text" id="f_tags" placeholder="pop, upbeat, guitar"></div>
        <div class="field"><div class="field-label">Title</div><input type="text" id="f_title" placeholder="My Song"></div>
        <div class="field"><div class="field-label">Lyrics</div><textarea id="f_lyrics" rows="3" placeholder="[Verse 1]\n..."></textarea></div>`,
      'suno-lyrics': `<div class="field"><div class="field-label">Prompt</div><input type="text" id="f_prompt" placeholder="A song about summer"></div>`,
      'suno-sounds': `<div class="field"><div class="field-label">Prompt</div><input type="text" id="f_prompt" placeholder="Rain on a tin roof"></div>`,
    };
    fields = sunoFields[m.id] || `<div class="field"><div class="field-label">Task ID</div><input type="text" id="f_task_id" placeholder="Enter task ID..."></div>`;
  } else {
    // Media generation
    if (!needsImage && !needsVideo) {
      fields += `<div class="field"><div class="field-label">Prompt</div>
        <textarea id="f_prompt" rows="3" placeholder="Describe what you want to generate..."></textarea>
      </div>`;
    }
    if (needsImage || needsVideo) {
      fields += `<div class="field"><div class="field-label">${needsVideo ? 'Video' : 'Image'} URL or Upload</div>
        <div class="inline-row" style="gap:6px;margin-bottom:6px">
          <input type="url" id="f_img_url" placeholder="https://..." style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font-mono);font-size:12px;padding:7px 10px;outline:none;" oninput="clearUpload()">
        </div>
        <div class="file-upload-area" onclick="document.getElementById('f_img_file').click()">
          <input type="file" id="f_img_file" accept="${needsVideo ? 'video/*' : 'image/*'}" onchange="handleMediaFile(event)">
          <div class="file-upload-text" id="mediaFileLabel"><b>Or upload file</b> (will auto-upload)</div>
        </div>
      </div>`;
      if (!needsVideo) {
        fields += `<div class="field"><div class="field-label">Prompt (optional)</div>
          <textarea id="f_prompt" rows="2" placeholder="Describe modifications..."></textarea>
        </div>`;
      }
    }
    if (isTTS) {
      fields = `<div class="field"><div class="field-label">Text</div>
        <textarea id="f_prompt" rows="3" placeholder="Text to speak..."></textarea>
      </div>
      <div class="field"><div class="field-label">Voice ID</div>
        <input type="text" id="f_voice_id" placeholder="e.g. Rachel">
      </div>`;
    }
    fields += `
      <div class="field"><div class="field-label">Callback URL (optional)</div>
        <input type="url" id="f_callback" placeholder="https://your-server.com/webhook">
      </div>`;
  }

  document.getElementById('panelContent').innerHTML = `
    <div class="panel-model-name">${m.name}</div>
    <div class="panel-body">
      ${fields}
      <div>
        <div class="field-label" style="margin-bottom:5px">Result</div>
        <div class="result-area" id="resultArea">Waiting for request...</div>
        <img id="resultImg" class="result-img" alt="result">
        <video id="resultVideo" class="result-video" controls></video>
        <audio id="resultAudio" class="result-audio" controls></audio>
      </div>
      <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Ready</span>
        <span style="margin-left:auto">
          <a href="${m.doc}" target="_blank" style="color:var(--accent2);font-size:10px;text-decoration:none">docs ↗</a>
        </span>
      </div>
    </div>
    <div class="panel-footer">
      <button class="btn primary" onclick="runRequest()">▶ Run</button>
      ${!isUpload && !isChat ? `<button class="btn" onclick="pollTask()" id="pollBtn" style="display:none">⟳ Poll Result</button>` : ''}
    </div>`;
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('fileLabel').innerHTML = `<b>${file.name}</b> (${(file.size/1024).toFixed(1)} KB)`;
  const reader = new FileReader();
  reader.onload = ev => { uploadedFileData = ev.target.result; };
  reader.readAsDataURL(file);
}

function handleMediaFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('mediaFileLabel').innerHTML = `<b>${file.name}</b> — auto-uploading...`;
  const formData = new FormData();
  formData.append('file', file);
  const key = getKey();
  if (!key) { setStatus('err','No API key'); return; }
  fetch('https://kieai.redpandaai.co/api/v1/upload/stream', {
    method:'POST',
    headers:{ 'Authorization': 'Bearer ' + key },
    body: formData
  }).then(r=>r.json()).then(d => {
    if (d.data && d.data.fileUrl) {
      document.getElementById('f_img_url').value = d.data.fileUrl;
      document.getElementById('mediaFileLabel').innerHTML = `<b>Uploaded:</b> ${d.data.fileName}`;
    } else {
      document.getElementById('mediaFileLabel').innerHTML = `<span style="color:var(--accent3)">Upload failed</span>`;
    }
  }).catch(()=>{
    document.getElementById('mediaFileLabel').innerHTML = `<span style="color:var(--accent3)">Upload error</span>`;
  });
}

function clearUpload() {
  const f = document.getElementById('f_img_file');
  if (f) f.value = '';
  const l = document.getElementById('mediaFileLabel');
  if (l) l.innerHTML = '<b>Or upload file</b>';
}

function getKey() {
  return document.getElementById('apiKey').value.trim() || sessionStorage.getItem('kie_api_key') || '';
}

function setStatus(state, msg) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (!dot || !txt) return;
  dot.className = 'status-dot ' + state;
  txt.textContent = msg;
}

function setResult(text) {
  const el = document.getElementById('resultArea');
  if (el) el.textContent = text;
}

let lastTaskId = null;

async function runRequest() {
  const key = getKey();
  if (!key) { alert('Please enter your API key first.'); return; }
  const m = currentModel;
  if (!m) return;

  setStatus('loading', 'Sending...');
  const img = document.getElementById('resultImg');
  const vid = document.getElementById('resultVideo');
  const aud = document.getElementById('resultAudio');
  if (img) img.style.display = 'none';
  if (vid) vid.style.display = 'none';
  if (aud) aud.style.display = 'none';

  try {
    let body, url, headers;
    const base = { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' };

    if (m.type === 'chat') {
      url = m.endpoint;
      headers = base;
      body = JSON.stringify({
        model: m.model,
        messages: [{ role:'user', content: document.getElementById('f_prompt')?.value || '' }],
        max_tokens: parseInt(document.getElementById('f_max_tokens')?.value || 1000),
        temperature: parseFloat(document.getElementById('f_temperature')?.value || 0.7),
      });
    } else if (m.cat === 'upload') {
      if (m.id === 'upload-url') {
        url = m.endpoint;
        headers = base;
        body = JSON.stringify({ fileUrl: document.getElementById('f_fileurl')?.value, fileName: document.getElementById('f_filename')?.value || undefined });
      } else if (m.id === 'upload-base64') {
        url = m.endpoint;
        headers = base;
        if (!uploadedFileData) { setStatus('err','Select a file first'); return; }
        body = JSON.stringify({ fileData: uploadedFileData, fileName: document.getElementById('f_filename')?.value || undefined });
      } else {
        // stream upload
        url = m.endpoint;
        const fileEl = document.getElementById('f_file');
        if (!fileEl || !fileEl.files[0]) { setStatus('err','Select a file first'); return; }
        const fd = new FormData();
        fd.append('file', fileEl.files[0]);
        const fname = document.getElementById('f_filename')?.value;
        if (fname) fd.append('fileName', fname);
        const res = await fetch(url, { method:'POST', headers:{ 'Authorization':'Bearer '+key }, body:fd });
        const data = await res.json();
        setResult(JSON.stringify(data, null, 2));
        setStatus(data.success ? 'ok' : 'err', data.success ? 'Uploaded' : 'Error');
        return;
      }
    } else if (m.cat === 'suno') {
      url = m.endpoint;
      headers = base;
      const payload = {};
      if (m.id === 'suno-generate') {
        payload.tags = document.getElementById('f_tags')?.value;
        payload.title = document.getElementById('f_title')?.value;
        payload.prompt = document.getElementById('f_lyrics')?.value;
      } else {
        payload.taskId = document.getElementById('f_task_id')?.value;
        const pr = document.getElementById('f_prompt');
        if (pr) payload.prompt = pr.value;
      }
      body = JSON.stringify(payload);
    } else {
      url = m.endpoint;
      headers = base;
      const payload = { model: m.model };
      const pr = document.getElementById('f_prompt');
      if (pr) payload.prompt = pr.value;
      const imgUrl = document.getElementById('f_img_url');
      if (imgUrl && imgUrl.value) payload.imageUrl = imgUrl.value;
      const cb = document.getElementById('f_callback');
      if (cb && cb.value) payload.callbackUrl = cb.value;
      const voiceId = document.getElementById('f_voice_id');
      if (voiceId && voiceId.value) payload.voiceId = voiceId.value;
      body = JSON.stringify(payload);
    }

    setResult('Sending request...');
    const res = await fetch(url, { method:'POST', headers, body });
    const data = await res.json();
    setResult(JSON.stringify(data, null, 2));

    // Handle task_id for polling
    if (data.data && data.data.taskId) {
      lastTaskId = data.data.taskId;
      const pollBtn = document.getElementById('pollBtn');
      if (pollBtn) { pollBtn.style.display = ''; }
      setStatus('loading', 'Task created — ' + lastTaskId);
    } else if (data.choices && data.choices[0]) {
      // Chat response
      const content = data.choices[0].message?.content || '';
      setResult(content);
      setStatus('ok', 'Done · ' + (data.usage?.total_tokens || '?') + ' tokens');
    } else if (data.code === 200 || data.success) {
      setStatus('ok', 'Success');
      // Check for direct media
      const fileUrl = data.data?.fileUrl;
      if (fileUrl) {
        if (img && /\.(jpg|jpeg|png|webp|gif)/i.test(fileUrl)) { img.src = fileUrl; img.style.display = 'block'; }
        else if (vid && /\.(mp4|webm)/i.test(fileUrl)) { vid.src = fileUrl; vid.style.display = 'block'; }
        else if (aud && /\.(mp3|wav|ogg)/i.test(fileUrl)) { aud.src = fileUrl; aud.style.display = 'block'; }
      }
    } else {
      setStatus('err', data.msg || 'Error');
    }
  } catch (e) {
    setResult('Error: ' + e.message);
    setStatus('err', 'Request failed');
  }
}

async function pollTask() {
  if (!lastTaskId) return;
  const key = getKey();
  setStatus('loading', 'Polling...');
  try {
    const res = await fetch('https://api.kie.ai/api/v1/market/task/' + lastTaskId, {
      headers: { 'Authorization': 'Bearer ' + key }
    });
    const data = await res.json();
    setResult(JSON.stringify(data, null, 2));
    const status = data.data?.status;
    if (status === 'completed' || status === 'succeed') {
      setStatus('ok', 'Completed!');
      // Try to show media
      const urls = data.data?.resultUrls || data.data?.resultUrl;
      const url = Array.isArray(urls) ? urls[0] : urls;
      if (url) {
        const img = document.getElementById('resultImg');
        const vid = document.getElementById('resultVideo');
        const aud = document.getElementById('resultAudio');
        if (img && /\.(jpg|jpeg|png|webp|gif)/i.test(url)) { img.src = url; img.style.display = 'block'; }
        else if (vid && /\.(mp4|webm)/i.test(url)) { vid.src = url; vid.style.display = 'block'; }
        else if (aud && /\.(mp3|wav|ogg)/i.test(url)) { aud.src = url; aud.style.display = 'block'; }
      }
    } else if (status === 'failed') {
      setStatus('err', 'Task failed');
    } else {
      setStatus('loading', 'Status: ' + (status || 'processing'));
    }
  } catch(e) {
    setStatus('err', 'Poll failed');
  }
}
</script>
